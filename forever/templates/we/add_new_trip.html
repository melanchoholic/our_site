{% extends 'base.html' %}

{% load django_bootstrap5 %}

{% block content %}
<style>
    /* Стили для всех полей ввода внутри вашего glass-контейнера */
    .glass .form-control,
    .glass .form-select,
    .glass textarea {
        background-color: rgba(255, 255, 255, 0.1); /* Полупрозрачный светлый фон */
        color: #ffffff; /* Белый текст */
        border: 1px solid rgba(255, 255, 255, 0.2); /* Полупрозрачная рамка */
    }

    /* Стили для полей при клике на них (фокус) */
    .glass .form-control:focus,
    .glass .form-select:focus,
    .glass textarea:focus {
        background-color: rgba(255, 255, 255, 0.15); /* Чуть светлее при фокусе */
        color: #ffffff;
        border-color: #0d6efd; /* Синяя рамка (цвет Bootstrap primary) */
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25); /* Синее свечение */
    }

    /* Стили для плейсхолдеров (текста-подсказки: "Откуда", "Куда" и т.д.) */
    .glass .form-control::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    /* Стили для кнопки выбора файла, чтобы она не была белой */
    .glass .form-control[type="file"]::file-selector-button {
        background-color: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        border: none;
        border-radius: 4px;
        margin-right: 10px;
    }
</style>

<div class="card-body">
    <div class='glass'>
<form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Отправить" %}
      </form>
    </div>
    </div>
{% endblock %}
